<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置新密码</title>
</head>
<body>
  <h2>设置新密码</h2>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.new_password1.label_tag }} {{ form.new_password1 }}<br><br>
      {{ form.new_password2.label_tag }} {{ form.new_password2 }}<br><br>
      <button type="submit">修改密码</button>
    </form>
  {% else %}
    <p>重置链接无效，请重新申请。</p>
  {% endif %}
</body>
</html>
