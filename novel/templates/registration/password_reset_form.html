<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>重置密码</title>
</head>
<body>
  <h2>重置密码</h2>
  <p>请输入您的注册邮箱，我们会发送重置链接到该邮箱。</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }} {{ form.email }}<br><br>
    <button type="submit">发送重置链接</button>
  </form>
</body>
</html>
